# kind cluster: 1 control-plane + 2 worker. Her node bir Docker container'idir (Kubernetes-in-Docker).
# control-plane'de 80/443 extraPortMappings -> ingress-nginx icin (identity.local).
# Kur: kind create cluster --name ecommerce --config deploy/k8s/kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ecommerce
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker