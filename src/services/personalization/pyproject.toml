[project]
name = "personalization"
version = "0.1.0"
description = "Personalization BC — davranis JSONL ingest + implicit ALS egitim + oneri API (042)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "implicit>=0.7.2",
    "scipy>=1.13",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "config", "db", "ingest", "train", "recommend"]

[tool.pytest.ini_options]
testpaths = ["tests"]