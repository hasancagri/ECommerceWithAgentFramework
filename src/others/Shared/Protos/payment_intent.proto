// Hosted Ödeme Girişimi — 077 hosted-CF start_payment S2S kanalı. Order.Api canlı intent'i sorgular
// (re-use) ve yeni intent/hosted link talep eder. Tek çağıranı Order.Api (yetki: payment.write).
// Sunucu: Payment.Api (GrpcServices=Server). Istemci: Order.Api (GrpcServices=Client).
syntax = "proto3";

option csharp_namespace = "Shared.Grpc.Payment";

package paymentintent;

service PaymentIntentService {
  // Aynı kullanıcı+sepet için canlı Pending intent var mı (order oluşturmadan önce re-use kontrolü).
  rpc GetLiveIntent (GetLiveIntentRequest) returns (GetLiveIntentReply);
  // Hosted ödeme linki üret (yoksa). Başarısız -> success=false (çağıran order'ı Cancel eder).
  rpc CreateIntent (CreateIntentRequest) returns (CreateIntentReply);
}

message GetLiveIntentRequest {
  string user_id = 1;
  string basket_ref = 2;
}

message GetLiveIntentReply {
  bool found = 1;
  string payment_intent_id = 2;
  string order_id = 3;
  string hosted_url = 4;
}

message CreateIntentRequest {
  string order_id = 1;
  string user_id = 2;
  string basket_ref = 3;
  double amount = 4;
  string tx_ref = 5;
}

message CreateIntentReply {
  bool success = 1;
  string payment_intent_id = 2;
  string hosted_url = 3;
  bool reused = 4;
}
