// Merchant API Key Okuma — 077 hosted-CF ödeme; Payment.Api PG hosted-payment X-Api-Key kaynağını
// S2S çeker. Tek çağıranı Payment.Api (yetki: customer.read). Key ASLA UI/LLM'e sızmaz.
// Sunucu: Customer.Api (GrpcServices=Server). Istemci: Payment.Api (GrpcServices=Client).
syntax = "proto3";

option csharp_namespace = "Shared.Grpc.Customer";

package merchantkey;

service MerchantKeyService {
  rpc GetKey (GetMerchantKeyRequest) returns (GetMerchantKeyReply);
}

message GetMerchantKeyRequest {
}

message GetMerchantKeyReply {
  bool found = 1;
  string merchant_key = 2;
}
