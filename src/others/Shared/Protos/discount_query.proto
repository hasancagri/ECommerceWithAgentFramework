// 079 checkout S2S kontratı — Order.Api sağası ödeme tutarını hesaplarken ürünlerin AKTİF indirim
// yüzdesini canlı doğrular. Discount.Api FİYAT DÖNMEZ (yalnız yüzde); etkin fiyatı çağıran kendi
// liste fiyatından hesaplar. Yetki: discount.read (Order makine token, SagaTokenHandler).
syntax = "proto3";

option csharp_namespace = "Shared.Grpc.Discount";

service DiscountQuery {
  // Order.Api StartPayment handler'ı sepet ürün id'leriyle çağırır; yalnız o an aktif kampanyası
  // olan ürünler için yüzde döner (aktif değilse listede yer almaz = indirim yok).
  rpc GetProductDiscounts (GetProductDiscountsRequest) returns (GetProductDiscountsReply);
}

message GetProductDiscountsRequest {
  repeated string product_ids = 1;  // Guid[] (sepet kalemleri)
}

message GetProductDiscountsReply {
  repeated DiscountItem discounts = 1;
}

message DiscountItem {
  string product_id = 1;
  int32 discount_percent = 2;  // 1-99, kitap başına tek etkin yüzde
}
