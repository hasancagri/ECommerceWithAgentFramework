// 072: Dış-kanal sipariş girişi — UCP session complete anında Order'a hedefli sipariş-oluşturma komutu
// (sanksiyonlu senkron gRPC, İlke I). Sunucu: Order.Api ince sarmalayıcı (GrpcServices=Server; iş
// mantığı yok, IMessageBus'a devreder). İstemci: Ucp.Api (GrpcServices=Client). Ödeme Order İÇİNDE
// tahsil edilir (mevcut chat charge yolu; iyzico sandbox), sonra StartCheckout(AlreadyCaptured).
syntax = "proto3";

option csharp_namespace = "Shared.Grpc.ExternalOrder";

package externalorder;

service ExternalOrder {
  // Yetki: order.write (UCP makine token'ı). external_ref → deterministik OrderId/PaymentId (idempotent).
  rpc CreateExternalOrder (CreateExternalOrderRequest) returns (CreateExternalOrderReply);
}

message CreateExternalOrderRequest {
  string external_ref    = 1;   // idempotency (session id / IdempotencyKey) → deterministik OrderId
  string currency        = 2;   // TRY
  int64  amount_minor    = 3;   // grand total, ISO 4217 minor units
  Buyer  buyer           = 4;
  repeated LineItem line_items = 5;
  string ucp_payment_ref = 6;   // UCP payment handler referansı (sandbox instrument seçimi)
}

message Buyer {
  string email      = 1;
  string first_name = 2;
  string last_name  = 3;
}

message LineItem {
  string product_id      = 1;
  int32  quantity        = 2;
  int64  unit_price_minor = 3;
}

message CreateExternalOrderReply {
  string order_ref = 1;   // Order.Code (başarı) / boş (başarısız)
  bool   charged   = 2;   // PG tahsilat sonucu
  string message   = 3;   // hata/durum açıklaması
}